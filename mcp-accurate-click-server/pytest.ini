[pytest]
# Pytest Configuration for MCP Accurate Click Server

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Test paths
testpaths = tests

# Additional command line options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Enable strict markers
    --strict-markers
    # Disable warnings capture
    -p no:warnings
    # Coverage options (if pytest-cov is installed)
    --cov=mcp_accurate_click
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json
    # Parallel execution (if pytest-xdist is installed)
    -n auto

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for complete workflows
    performance: Performance and benchmark tests
    slow: Tests that take significant time to run
    requires_ocr: Tests that require OCR models to be available
    windows_only: Tests that only run on Windows
    calibration: Tests related to calibration system
    accuracy: Tests validating accuracy requirements

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test_results/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration
[coverage:run]
source = src/mcp_accurate_click
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = tests/test_results/htmlcov
